# ============================================================
# Polymarket Auto-Trader — docker compose
# ============================================================
# The dashboard binds to 127.0.0.1 ONLY. Reach it through an SSH tunnel:
#   ssh -L 5000:127.0.0.1:5000 user@SERVER_IP
# then open http://localhost:5000 locally.
# Optionally put it behind nginx with Basic Auth instead.
# ============================================================

services:
  polymarket-bot:
    build: .
    container_name: polymarket-bot
    environment:
      - POLY_WORKSPACE=/data
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped
